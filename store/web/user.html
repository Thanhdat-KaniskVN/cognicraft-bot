<!DOCTYPE html>
<html lang="vi" data-theme="cyberpunk">
<head><script src="https://accounts.google.com/gsi/client" async defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile · CogniCraft Store</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>

<div class="grid-bg"></div>
<div id="cyberpunk-scene"></div>
<div id="sakura-container"></div>

<header class="header">
    <div class="logo">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 1rem;">
            <span class="logo-icon">🏛️</span>
            <div>
                <h1 class="font-display">COGNICRAFT STORE</h1>
                <p class="subtitle">← Quay lại</p>
            </div>
        </a>
    </div>
    <div class="status-bar">
    <div id="auth-container" class="auth-container"></div>
    <div id="theme-switcher" class="theme-switcher"></div>
    </div>
</header>

<main class="main">
    <div class="loading-state" id="loading">
        <span class="spinner"></span> Đang tải profile...
    </div>

    <div id="user-profile" style="display:none;"></div>
</main>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="presence.js"></script>
<script src="user-theme.js"></script>
<script src="theme-switcher.js"></script>
<script>
const API_URL = window.STORE_API || "http://localhost:8001";

// ============================================================
// SECURITY: Escape HTML
// ============================================================
function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/`/g, "&#96;");
}

function escapeJs(str) {
    if (str === null || str === undefined) return "";
    return String(str)
        .replace(/\\/g, "\\\\")
        .replace(/`/g, "\\`")
        .replace(/\$\{/g, "\\${")
        .replace(/'/g, "\\'");
}

// ============================================================
// LOAD
// ============================================================
async function loadUserProfile() {
    const params = new URLSearchParams(window.location.search);
    const username = params.get("username") || params.get("u");

    if (!username) {
        window.location.href = "index.html";
        return;
    }

    try {
        const r = await fetch(`${API_URL}/api/store/users/${encodeURIComponent(username)}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);

        const data = await r.json();
        renderProfile(data);
    } catch (e) {
        document.getElementById("loading").innerHTML =
            `<div style="color: var(--red);">❌ Lỗi: ${escapeHtml(e.message)}</div>`;
    }
}

function renderProfile(data) {
    document.getElementById("loading").style.display = "none";
    const container = document.getElementById("user-profile");
    container.style.display = "block";

    if (data.not_found || !data.reviews || data.reviews.length === 0) {
        container.innerHTML = `
            <div style="max-width: 800px; margin: 0 auto; text-align: center; padding: 4rem 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">👤</div>
                <h2 class="font-display" style="color: var(--cyan); margin-bottom: 0.5rem;">${escapeHtml(data.display_name || data.username)}</h2>
                <p style="color: var(--dim);">Chưa viết đánh giá nào.</p>
                <a href="index.html" style="display: inline-block; margin-top: 2rem; color: var(--cyan); text-decoration: none; border: 1px solid var(--cyan); padding: 0.6rem 1.5rem; border-radius: 6px;">← Về trang chủ</a>
            </div>
        `;
        return;
    }

    const s = data.stats;
    const initial = escapeHtml((data.display_name || data.username || "?").charAt(0).toUpperCase());

    container.innerHTML = `
        <div style="max-width: 1000px; margin: 0 auto;">
            <div style="padding: 2.5rem; background: linear-gradient(135deg, var(--bg-elev), var(--card)); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 2rem; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--green), var(--cyan), var(--green));"></div>

                <div style="display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;">
                    <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--green), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; color: var(--bg); box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); font-family: 'Orbitron', sans-serif;">${initial}</div>

                    <div style="flex: 1; min-width: 250px;">
                        <div style="color: var(--dim); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.3rem;">USER</div>
                        <h2 class="font-display" style="color: var(--green); font-size: 2.2rem; margin-bottom: 0.5rem;">${escapeHtml(data.display_name)}</h2>
                        <p style="color: var(--dim); font-size: 0.9rem;">@${escapeHtml(data.username)}</p>
                        ${data.bio ? `<p style="color: var(--text); font-size: 0.85rem; margin-top: 0.6rem; max-width: 500px; line-height: 1.5;">${escapeHtml(data.bio)}</p>` : ""}
                        <div style="display: flex; gap: 0.6rem; margin-top: 0.8rem; flex-wrap: wrap;">
                            ${data.github_username ? `<a href="https://github.com/${escapeHtml(data.github_username)}" target="_blank" style="display: flex; align-items: center; gap: 0.3rem; color: var(--dim); text-decoration: none; font-size: 0.8rem; border: 1px solid var(--border); padding: 0.3rem 0.7rem; border-radius: 6px; transition: all 0.2s;" onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan)'" onmouseout="this.style.color='var(--dim)'; this.style.borderColor='var(--border)'">🐙 GitHub</a>` : ""}
                            ${data.code_room_slug ? `<a href="http://localhost:8000/code?user=${escapeHtml(data.code_room_slug)}" target="_blank" style="display: flex; align-items: center; gap: 0.3rem; color: var(--dim); text-decoration: none; font-size: 0.8rem; border: 1px solid var(--border); padding: 0.3rem 0.7rem; border-radius: 6px; transition: all 0.2s;" onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan)'" onmouseout="this.style.color='var(--dim)'; this.style.borderColor='var(--border)'">💻 Code Room</a>` : ""}
                            ${data.website ? `<a href="${escapeHtml(data.website)}" target="_blank" style="display: flex; align-items: center; gap: 0.3rem; color: var(--dim); text-decoration: none; font-size: 0.8rem; border: 1px solid var(--border); padding: 0.3rem 0.7rem; border-radius: 6px; transition: all 0.2s;" onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan)'" onmouseout="this.style.color='var(--dim)'; this.style.borderColor='var(--border)'">🌐 Website</a>` : ""}
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-top: 2rem;">
                    <div style="padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid var(--border);">
                        <div style="color: var(--dim); font-size: 0.7rem; text-transform: uppercase;">Reviews</div>
                        <div class="font-display" style="color: var(--green); font-size: 1.8rem;">${escapeHtml(s.total_reviews)}</div>
                    </div>
                    <div style="padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid var(--border);">
                        <div style="color: var(--dim); font-size: 0.7rem; text-transform: uppercase;">Avg Rating</div>
                        <div class="font-display" style="color: var(--yellow); font-size: 1.8rem;">${escapeHtml(s.avg_rating_given)}</div>
                    </div>
                    <div style="padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid var(--border);">
                        <div style="color: var(--dim); font-size: 0.7rem; text-transform: uppercase;">Helpful</div>
                        <div class="font-display" style="color: var(--cyan); font-size: 1.8rem;">${escapeHtml(s.helpful_received)}</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h3 class="font-heading">⭐ ĐÁNH GIÁ ĐÃ VIẾT</h3>
                    <span class="count">${escapeHtml(data.reviews.length)} reviews</span>
                </div>
                <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem;">
                    ${data.reviews.map(r => `
                        <div style="padding: 1rem; border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: flex-start;">
                            <div style="font-size: 2rem; min-width: 40px;">${escapeHtml(r.plugin_icon || "📦")}</div>
                            <div style="flex: 1;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">
                                    <a href="plugin.html?slug=${escapeHtml(r.plugin_slug)}" style="color: var(--cyan); text-decoration: none; font-weight: 700; font-size: 0.95rem;">${escapeHtml(r.plugin_name)}</a>
                                    <div style="color: var(--yellow); font-size: 0.9rem;">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div>
                                </div>
                                ${r.comment ? `<p style="color: var(--text); font-size: 0.85rem; line-height: 1.5; margin: 0.3rem 0;">${escapeHtml(r.comment)}</p>` : ""}
                                <div style="display: flex; gap: 1rem; font-size: 0.7rem; color: var(--dim); margin-top: 0.4rem;">
                                    <span>👍 ${escapeHtml(r.helpful_count || 0)} hữu ích</span>
                                    <span>${new Date(r.created_at).toLocaleDateString("vi-VN")}</span>
                                </div>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>
        </div>
    `;
}

loadUserProfile();
</script>
  <script src="theme-3d-scenes.js"></script>
  <script src="theme-3d-runtime.js"></script>
</body>
</html>
