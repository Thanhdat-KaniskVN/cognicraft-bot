<!DOCTYPE html>
<html lang="vi" data-theme="cyberpunk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CogniCraft Store · Plugin Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>

<div class="grid-bg"></div>
<div id="cyberpunk-scene"></div>
<div id="sakura-container"></div>

<header class="header">
    <div class="logo">
        <span class="logo-icon">🏛️</span>
        <div>
            <h1 class="font-display">COGNICRAFT STORE</h1>
            <p class="subtitle">Plugin Marketplace · Ecosystem</p>
        </div>
    </div>
    <div class="status-bar">
        <span class="live-dot"></span>
        <span>LIVE</span>
        <span id="stats-summary">Loading...</span>
        <a href="upload.html" style="display: flex; align-items: center; gap: 0.4rem; background: linear-gradient(135deg, var(--green), var(--cyan)); color: var(--bg); text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.78rem; font-weight: 700; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); transition: all 0.2s; white-space: nowrap;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 0 25px rgba(0, 255, 136, 0.7)'" onmouseout="this.style.transform=''; this.style.boxShadow='0 0 15px rgba(0, 255, 136, 0.4)'">📤 Publish</a>
        <div id="theme-switcher" class="theme-switcher"></div>
    </div>
</header>

<main class="main">

    <!-- HERO -->
    <section class="hero">
        <h2 class="font-display">KHÁM PHÁ PLUGINS</h2>
        <p>Mở rộng CogniCraft với hàng trăm công cụ</p>
    </section>

    <!-- SEARCH + FILTER -->
    <section class="controls">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Tìm plugin, author, tag..." autocomplete="off">
            <div id="search-suggestions" class="search-suggestions"></div>
        </div>

        <select id="category-filter" class="filter-select">
            <option value="">📁 Tất cả</option>
        </select>

        <select id="sort-filter" class="filter-select">
            <option value="downloads">📥 Nhiều tải nhất</option>
            <option value="rating">⭐ Đánh giá cao</option>
            <option value="trending">🔥 Trending</option>
            <option value="created_at">🆕 Mới nhất</option>
            <option value="name">🔤 Tên A-Z</option>
        </select>

        <button class="filter-toggle-btn" onclick="toggleFilterPanel()">
            ⚙️ Bộ lọc <span id="filter-badge" class="filter-badge" style="display: none;">0</span>
        </button>
    </section>

    <!-- ADVANCED FILTER PANEL -->
    <section id="filter-panel" class="filter-panel">
        <div class="filter-row">
            <div class="filter-field">
                <label>Tác giả</label>
                <input type="text" id="filter-author" placeholder="VD: Thanhdat">
            </div>
            <div class="filter-field">
                <label>Đánh giá tối thiểu</label>
                <select id="filter-rating">
                    <option value="">Tất cả</option>
                    <option value="4.5">4.5★ trở lên</option>
                    <option value="4">4★ trở lên</option>
                    <option value="3">3★ trở lên</option>
                </select>
            </div>
            <div class="filter-field">
                <label>Loại</label>
                <select id="filter-price">
                    <option value="">Tất cả</option>
                    <option value="free">Miễn phí</option>
                    <option value="paid">Trả phí</option>
                    <option value="freemium">Freemium</option>
                </select>
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn-primary" onclick="applyAdvancedFilters()">✅ Áp dụng</button>
            <button class="btn-secondary" onclick="resetFilters()">🔄 Reset</button>
        </div>
    </section>

    <!-- CATEGORIES -->
    <section class="categories" id="categories-bar"></section>

    <!-- POPULAR TAGS -->
    <section class="tags-section">
        <div class="tags-label">🏷️ POPULAR TAGS:</div>
        <div class="tags-list" id="popular-tags">Đang tải...</div>
    </section>

    <!-- FEATURED -->
    <section class="section">
        <div class="section-header">
            <h3 class="font-heading">🌟 FEATURED</h3>
            <span class="count" id="featured-count"></span>
        </div>
        <div class="plugins-grid" id="featured-grid"></div>
    </section>

    <!-- ALL PLUGINS -->
    <section class="section">
        <div class="section-header">
            <h3 class="font-heading">📦 TẤT CẢ PLUGINS</h3>
            <span class="count" id="total-count"></span>
        </div>
        <div class="plugins-grid" id="plugins-grid"></div>
        <div class="loading-state" id="loading" style="display:none;">
            <span class="spinner"></span> Đang tải...
        </div>
        <div class="empty-state" id="empty-state" style="display:none;">
            <span style="font-size: 3rem;">📭</span>
            <p>Không tìm thấy plugin nào</p>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <span>CogniCraft Store v2.2.0</span>
        <span id="last-update">—</span>
    </footer>
</main>

<div id="toast" class="toast"></div>

<script src="theme-switcher.js"></script>
<script src="app.js"></script>
</body>
</html>
