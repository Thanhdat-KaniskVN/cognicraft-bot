<!DOCTYPE html>
<html lang="vi" data-theme="cyberpunk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · CogniCraft Store</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="grid-bg"></div>
<div id="cyberpunk-scene"></div>
<div id="sakura-container"></div>

<header class="header">
    <div class="logo">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 1rem;">
            <span class="logo-icon">🏛️</span>
            <div>
                <h1 class="font-display">COGNICRAFT STORE</h1>
                <p class="subtitle">← Quay lại</p>
            </div>
        </a>
    </div>
    <div class="status-bar">
        <div id="auth-container" class="auth-container"></div>
        <div id="theme-switcher" class="theme-switcher"></div>
    </div>
</header>

<main class="main">
    <div class="loading-state" id="loading">
        <span class="spinner"></span> Đang tải...
    </div>

    <div id="settings-container" style="display:none; max-width: 800px; margin: 2rem auto;">

        <!-- HEADER -->
        <div style="background: linear-gradient(135deg, var(--bg-elev), var(--card)); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden;">
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--cyan), var(--purple), var(--cyan));"></div>

            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <img id="user-avatar" src="" alt="" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--cyan); display: none;" referrerpolicy="no-referrer">
                <div id="user-avatar-fallback" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: var(--bg); font-family: 'Orbitron', sans-serif;">?</div>
                <div>
                    <h2 class="font-display" style="color: var(--cyan); font-size: 1.8rem;" id="user-name">...</h2>
                    <p style="color: var(--dim); font-size: 0.9rem;" id="user-email">...</p>
                </div>
            </div>
        </div>

        <!-- FORM -->
        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;">
            <h3 class="font-heading" style="color: var(--cyan); margin-bottom: 1.5rem; font-size: 1rem;">👤 THÔNG TIN CÁ NHÂN</h3>

            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; display: block; margin-bottom: 0.4rem;">🐙 GitHub Username</label>
                    <input type="text" id="github-username" placeholder="VD: Thanhdat-KaniskVN" style="width: 100%; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem; color: var(--text); font-family: inherit; font-size: 0.9rem; box-sizing: border-box;">
                    <p style="color: var(--dim); font-size: 0.75rem; margin-top: 0.3rem;">→ github.com/<span id="github-preview" style="color: var(--cyan);">...</span></p>
                </div>

                <div>
                    <label style="color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; display: block; margin-bottom: 0.4rem;">💻 Code Room Slug</label>
                    <input type="text" id="code-room-slug" placeholder="VD: thanhdat" style="width: 100%; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem; color: var(--text); font-family: inherit; font-size: 0.9rem; box-sizing: border-box;">
                    <p style="color: var(--dim); font-size: 0.75rem; margin-top: 0.3rem;">→ localhost:8000/code?user=<span id="coderoom-preview" style="color: var(--cyan);">...</span></p>
                </div>

                <div>
                    <label style="color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; display: block; margin-bottom: 0.4rem;">🌐 Website</label>
                    <input type="url" id="website" placeholder="VD: https://myblog.com" style="width: 100%; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem; color: var(--text); font-family: inherit; font-size: 0.9rem; box-sizing: border-box;">
                </div>

                <div>
                    <label style="color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; display: block; margin-bottom: 0.4rem;">✍️ Bio (tối đa 200 ký tự)</label>
                    <textarea id="bio" rows="4" maxlength="200" placeholder="Giới thiệu ngắn về bản thân..." style="width: 100%; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem; color: var(--text); font-family: inherit; font-size: 0.9rem; resize: vertical; box-sizing: border-box;"></textarea>
                    <p style="color: var(--dim); font-size: 0.75rem; margin-top: 0.3rem;"><span id="bio-count" style="color: var(--cyan);">0</span>/200 ký tự</p>
                </div>
            </div>
        </div>

        <!-- ACTIONS -->
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <a href="user.html" id="view-profile-btn" style="text-decoration: none; padding: 0.8rem 1.5rem; background: transparent; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 8px; font-family: inherit; font-size: 0.9rem; font-weight: 700;">👤 Xem Profile</a>
            <button onclick="saveProfile()" style="padding: 0.8rem 2rem; background: linear-gradient(135deg, var(--green), var(--cyan)); color: var(--bg); border: none; border-radius: 8px; font-family: inherit; font-size: 0.9rem; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);">💾 LƯU</button>
        </div>
    </div>
</main>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="presence.js"></script>
<script src="user-theme.js"></script>
<script src="theme-switcher.js"></script>
<script>
const API_URL = window.STORE_API || "http://localhost:8001";

function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function showToast(msg, type = "info") {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.className = `toast show ${type}`;
    setTimeout(() => toast.classList.remove("show"), 3000);
}

async function loadProfile() {
    const user = window.CogniAuth && window.CogniAuth.getUser();
    const token = window.CogniAuth && window.CogniAuth.getToken();

    if (!user || !token) {
        document.getElementById("loading").innerHTML = `
            <div style="text-align: center; padding: 3rem;">
                <p style="color: var(--dim); margin-bottom: 1rem;">Bạn cần đăng nhập để truy cập Settings</p>
                <a href="index.html" style="color: var(--cyan); text-decoration: none; border: 1px solid var(--cyan); padding: 0.6rem 1.5rem; border-radius: 6px;">← Đăng nhập</a>
            </div>
        `;
        return;
    }

    try {
        const r = await fetch(`${API_URL}/api/auth/me`, {
            headers: { "Authorization": `Bearer ${token}` },
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);

        const data = await r.json();
        renderProfile(data);
    } catch (e) {
        document.getElementById("loading").innerHTML =
            `<div style="color: var(--red); text-align: center;">❌ ${escapeHtml(e.message)}</div>`;
    }
}

function renderProfile(user) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("settings-container").style.display = "block";

    if (user.avatar_url) {
        const img = document.getElementById("user-avatar");
        img.src = user.avatar_url;
        img.style.display = "block";
        document.getElementById("user-avatar-fallback").style.display = "none";
    } else {
        document.getElementById("user-avatar-fallback").textContent = (user.name || "?").charAt(0).toUpperCase();
    }

    document.getElementById("user-name").textContent = user.name || "";
    document.getElementById("user-email").textContent = user.email || "";

    document.getElementById("github-username").value = user.github_username || "";
    document.getElementById("code-room-slug").value = user.code_room_slug || "";
    document.getElementById("website").value = user.website || "";
    document.getElementById("bio").value = user.bio || "";

    updatePreviews();
    updateBioCount();

    const username = (user.name || 'user').toLowerCase().replace(/\s+/g, '_');
    document.getElementById("view-profile-btn").href = `user.html?username=${encodeURIComponent(username)}`;
}

function updatePreviews() {
    const gh = document.getElementById("github-username").value.trim();
    const cr = document.getElementById("code-room-slug").value.trim();
    document.getElementById("github-preview").textContent = gh || "...";
    document.getElementById("coderoom-preview").textContent = cr || "...";
}

function updateBioCount() {
    const bio = document.getElementById("bio").value;
    document.getElementById("bio-count").textContent = bio.length;
}

async function saveProfile() {
    const token = window.CogniAuth && window.CogniAuth.getToken();
    if (!token) {
        showToast("❌ Bạn chưa đăng nhập", "error");
        return;
    }

    const payload = {
        github_username: document.getElementById("github-username").value.trim() || null,
        code_room_slug: document.getElementById("code-room-slug").value.trim() || null,
        website: document.getElementById("website").value.trim() || null,
        bio: document.getElementById("bio").value.trim() || null,
    };

    try {
        const r = await fetch(`${API_URL}/api/auth/me`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
        });

        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);

        const user = window.CogniAuth.getUser();
        Object.assign(user, data.user);
        localStorage.setItem("cognicraft_user", JSON.stringify(user));

        showToast("✅ Đã lưu profile!", "success");
    } catch (e) {
        showToast(`❌ ${e.message}`, "error");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("github-username").addEventListener("input", updatePreviews);
    document.getElementById("code-room-slug").addEventListener("input", updatePreviews);
    document.getElementById("bio").addEventListener("input", updateBioCount);

    setTimeout(loadProfile, 500);
});
</script>
</body>
</html>
