<!DOCTYPE html>
<html lang="vi" data-theme="cyberpunk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Detail · CogniCraft Store</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="grid-bg"></div>
<div id="cyberpunk-scene"></div>
<div id="sakura-container"></div>

<header class="header">
    <div class="logo">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 1rem;">
            <span class="logo-icon">🏛️</span>
            <div>
                <h1 class="font-display">COGNICRAFT STORE</h1>
                <p class="subtitle">← Quay lại</p>
            </div>
        </a>
    </div>
    <div class="status-bar">
        <div id="auth-container" class="auth-container"></div>
        <div id="theme-switcher" class="theme-switcher"></div>
    </div>
</header>

<main class="main">
    <div class="loading-state" id="loading">
        <span class="spinner"></span> Đang tải plugin...
    </div>
    <div id="plugin-detail" style="display:none;"></div>
</main>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="presence.js"></script>
<script src="theme-switcher.js"></script>
<script>
const API_URL = window.STORE_API || "http://localhost:8001";
let selectedRating = 0;

// ============================================================
// SECURITY
// ============================================================
function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/`/g, "&#96;");
}

function escapeJs(str) {
    if (str === null || str === undefined) return "";
    return String(str)
        .replace(/\\/g, "\\\\")
        .replace(/`/g, "\\`")
        .replace(/\$\{/g, "\\${")
        .replace(/'/g, "\\'");
}

// ============================================================
// LOAD
// ============================================================
async function loadPluginDetail() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    if (!slug) {
        window.location.href = "index.html";
        return;
    }

    try {
        const [pluginRes, reviewsRes] = await Promise.all([
            fetch(`${API_URL}/api/store/plugins/${encodeURIComponent(slug)}`),
            fetch(`${API_URL}/api/store/reviews/${encodeURIComponent(slug)}`),
        ]);

        if (!pluginRes.ok) throw new Error(`HTTP ${pluginRes.status}`);

        const data = await pluginRes.json();
        const reviewsData = reviewsRes.ok ? await reviewsRes.json() : { reviews: [], total: 0, breakdown: {} };

        renderDetail(data, reviewsData);
    } catch (e) {
        document.getElementById("loading").innerHTML =
            `<div style="color: var(--red);">❌ Lỗi: ${escapeHtml(e.message)}</div>`;
    }
}

function renderDetail(data, reviewsData) {
    const p = data.plugin;
    const versions = data.versions || [];
    const reviews = reviewsData.reviews || [];
    const breakdown = reviewsData.breakdown || {};

    const stars = "★".repeat(Math.round(p.rating || 0)) + "☆".repeat(5 - Math.round(p.rating || 0));

    const detail = document.getElementById("plugin-detail");
    detail.style.display = "block";
    document.getElementById("loading").style.display = "none";

    detail.innerHTML = `
        <div style="max-width: 900px; margin: 0 auto;">
            <!-- HEADER -->
            <div class="plugin-detail-header" style="display: flex; gap: 2rem; align-items: flex-start; padding: 2rem; background: linear-gradient(135deg, var(--bg-elev) 0%, var(--card) 100%); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 2rem; flex-wrap: wrap;">
                <div style="font-size: 5rem;">${escapeHtml(p.icon || "📦")}</div>
                <div style="flex: 1; min-width: 250px;">
                    <h2 class="font-display" style="font-size: 2rem; color: var(--cyan); margin-bottom: 0.5rem;">${escapeHtml(p.name)}</h2>
                    <p style="color: var(--dim); margin-bottom: 1rem;">${escapeHtml(p.description || "")}</p>
                    <div style="display: flex; gap: 2rem; font-size: 0.9rem; color: var(--dim); flex-wrap: wrap; align-items: center;">
                        <a href="author.html?username=${encodeURIComponent(p.author)}" style="color: var(--dim); text-decoration: none; border-bottom: 1px dashed var(--dim); transition: all 0.2s; padding-bottom: 1px;" onmouseover="this.style.color='var(--cyan)'; this.style.borderBottomColor='var(--cyan)'" onmouseout="this.style.color='var(--dim)'; this.style.borderBottomColor='var(--dim)'">👤 ${escapeHtml(p.author)}</a>
                        <span>📁 ${escapeHtml(p.category)}</span>
                        <span style="color: var(--yellow);">${stars} ${escapeHtml(p.rating)}</span>
                        <span>📥 ${escapeHtml(p.downloads)} downloads</span>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem; min-width: 180px;">
                    <button onclick="installPlugin('${escapeJs(p.slug)}')" style="padding: 1rem 1.5rem; background: var(--green); color: var(--bg); border: none; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 20px var(--green); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">📥 INSTALL</button>
                    <button onclick="syncToGitHub('${escapeJs(p.slug)}', '${escapeJs(p.name)}')" style="padding: 0.7rem 1.5rem; background: #24292e; color: white; border: 1px solid #444d56; border-radius: 8px; font-family: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem;" onmouseover="this.style.background='#2f363d'; this.style.transform='scale(1.03)'" onmouseout="this.style.background='#24292e'; this.style.transform='scale(1)'">🐙 Sync to GitHub</button>
                </div>
            </div>

            <!-- DESCRIPTION -->
            ${p.long_description ? `
                <div class="section" style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;">
                    <h3 class="font-heading" style="color: var(--cyan); margin-bottom: 1rem;">📝 MÔ TẢ</h3>
                    <p style="color: var(--text); line-height: 1.7;">${escapeHtml(p.long_description)}</p>
                </div>
            ` : ""}

            <!-- VERSIONS -->
            ${versions.length > 0 ? `
                <div class="section" style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;">
                    <h3 class="font-heading" style="color: var(--cyan); margin-bottom: 1rem;">📋 PHIÊN BẢN</h3>
                    ${versions.map(v => `
                        <div style="padding: 0.8rem; border-left: 3px solid var(--cyan); margin-bottom: 0.5rem; background: rgba(var(--primary-rgb), 0.03);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.3rem;">
                                <strong style="color: var(--text);">v${escapeHtml(v.version)}</strong>
                                <span style="color: var(--dim); font-size: 0.8rem;">${new Date(v.created_at).toLocaleDateString("vi-VN")}</span>
                            </div>
                            <p style="color: var(--dim); font-size: 0.85rem;">${escapeHtml(v.changelog || "")}</p>
                        </div>
                    `).join("")}
                </div>
            ` : ""}

            <!-- REVIEWS -->
            <div class="section" style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;">
                <h3 class="font-heading" style="color: var(--cyan); margin-bottom: 1.5rem;">⭐ ĐÁNH GIÁ (${escapeHtml(reviews.length)})</h3>

                ${reviews.length > 0 ? `
                    <div style="display: flex; gap: 2rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap;">
                        <div style="text-align: center; min-width: 100px;">
                            <div class="font-display" style="font-size: 3rem; color: var(--yellow); line-height: 1;">${escapeHtml(p.rating || "0.0")}</div>
                            <div style="color: var(--yellow); font-size: 1.2rem; margin: 0.3rem 0;">${stars}</div>
                            <div style="color: var(--dim); font-size: 0.8rem;">${escapeHtml(reviews.length)} đánh giá</div>
                        </div>
                        <div style="flex: 1; min-width: 250px;">
                            ${[5,4,3,2,1].map(star => {
                                const count = breakdown[star] || 0;
                                const pct = reviews.length > 0 ? (count / reviews.length * 100) : 0;
                                return `
                                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; font-size: 0.85rem;">
                                        <span style="color: var(--yellow); width: 40px;">${star} ★</span>
                                        <div style="flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;">
                                            <div style="width: ${pct}%; height: 100%; background: var(--yellow); transition: width 0.3s;"></div>
                                        </div>
                                        <span style="color: var(--dim); width: 30px; text-align: right;">${escapeHtml(count)}</span>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>
                ` : ""}

                <!-- Review Form -->
                <div style="background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 2rem;">
                    <h4 class="font-heading" style="color: var(--cyan); margin-bottom: 1rem; font-size: 0.95rem;">✍️ VIẾT ĐÁNH GIÁ</h4>

                    <div style="margin-bottom: 0.8rem;">
                        <label style="color: var(--dim); font-size: 0.8rem; display: block; margin-bottom: 0.3rem;">Tên của bạn</label>
                        <input type="text" id="review-name" placeholder="VD: Thanhdat" style="width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.8rem; color: var(--text); font-family: inherit; font-size: 0.85rem; box-sizing: border-box;" value="${escapeHtml((window.CogniAuth && window.CogniAuth.getUser()?.name) || localStorage.getItem('cognicraft_username') || '')}">
                    </div>

                    <div style="margin-bottom: 0.8rem;">
                        <label style="color: var(--dim); font-size: 0.8rem; display: block; margin-bottom: 0.3rem;">Đánh giá</label>
                        <div id="review-stars" style="font-size: 1.8rem; cursor: pointer; user-select: none;">
                            ${[1,2,3,4,5].map(i => `<span data-star="${i}" style="color: var(--dim); transition: color 0.15s;">★</span>`).join("")}
                        </div>
                        <input type="hidden" id="review-rating" value="0">
                    </div>

                    <div style="margin-bottom: 0.8rem;">
                        <label style="color: var(--dim); font-size: 0.8rem; display: block; margin-bottom: 0.3rem;">Nhận xét (tùy chọn)</label>
                        <textarea id="review-comment" rows="3" placeholder="Plugin này thế nào?" style="width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.8rem; color: var(--text); font-family: inherit; font-size: 0.85rem; resize: vertical; box-sizing: border-box;"></textarea>
                    </div>

                    <button onclick="submitReview('${escapeJs(p.slug)}')" style="background: var(--green); color: var(--bg); border: none; border-radius: 6px; padding: 0.6rem 1.5rem; font-family: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 15px var(--green);">🚀 GỬI ĐÁNH GIÁ</button>
                </div>

                <!-- Review List -->
                ${reviews.length === 0
                    ? '<p style="color: var(--dim); text-align: center; padding: 1rem;">Chưa có đánh giá nào. Hãy là người đầu tiên!</p>'
                    : reviews.map(r => `
                        <div style="padding: 1rem; border-bottom: 1px solid var(--border);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <a href="user.html?username=${encodeURIComponent((r.user_name || 'anonymous').toLowerCase().replace(/\s+/g, '_'))}" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                                        <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--purple)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: var(--bg);">${escapeHtml((r.user_name || "A").charAt(0).toUpperCase())}</div>
                                        <strong style="color: var(--text); font-size: 0.9rem; border-bottom: 1px dashed var(--dim); padding-bottom: 1px;" onmouseover="this.style.color='var(--cyan)'; this.style.borderBottomColor='var(--cyan)'" onmouseout="this.style.color='var(--text)'; this.style.borderBottomColor='var(--dim)'">${escapeHtml(r.user_name || "Anonymous")}</strong>
                                    </a>
                                </div>
                                <div style="text-align: right;">
                                    <div style="color: var(--yellow); font-size: 0.95rem;">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div>
                                    <div style="color: var(--dim); font-size: 0.7rem;">${new Date(r.created_at).toLocaleDateString("vi-VN")}</div>
                                </div>
                            </div>
                            ${r.comment ? `<p style="color: var(--text); font-size: 0.85rem; line-height: 1.5; margin-top: 0.5rem;">${escapeHtml(r.comment)}</p>` : ""}
                            <div style="margin-top: 0.5rem;">
                                <button onclick="markHelpful('${escapeJs(r.id)}', this)" style="background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 0.3rem 0.6rem; color: var(--dim); font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;">👍 Hữu ích ${r.helpful_count > 0 ? `(${escapeHtml(r.helpful_count)})` : ""}</button>
                            </div>
                        </div>
                    `).join("")}
            </div>
        </div>
    `;

    setTimeout(initStarRating, 50);
}

// ============================================================
// STAR RATING
// ============================================================
function initStarRating() {
    const container = document.getElementById('review-stars');
    if (!container) return;

    const stars = container.querySelectorAll('span');
    stars.forEach(star => {
        const val = parseInt(star.dataset.star);

        star.addEventListener('mouseenter', () => {
            stars.forEach((s, i) => {
                s.style.color = i < val ? '#ffcc00' : 'var(--dim)';
            });
        });

        star.addEventListener('click', () => {
            selectedRating = val;
            document.getElementById('review-rating').value = val;
            stars.forEach((s, i) => {
                s.style.color = i < val ? '#ffcc00' : 'var(--dim)';
            });
        });
    });

    container.addEventListener('mouseleave', () => {
        stars.forEach((s, i) => {
            s.style.color = i < selectedRating ? '#ffcc00' : 'var(--dim)';
        });
    });
}

// ============================================================
// SUBMIT REVIEW
// ============================================================
async function submitReview(slug) {
    const sessionUser = window.CogniAuth && window.CogniAuth.getUser();
    const name = sessionUser ? sessionUser.name : document.getElementById('review-name').value.trim();
    const rating = parseInt(document.getElementById('review-rating').value);
    const comment = document.getElementById('review-comment').value.trim();

    if (!name) { showToast('❌ Nhập tên của bạn', 'error'); return; }
    if (rating < 1 || rating > 5) { showToast('❌ Chọn số sao (1-5)', 'error'); return; }

    localStorage.setItem('cognicraft_username', name);

    const payload = {
        user_id: name.toLowerCase().replace(/\s+/g, '_'),
        user_name: name,
        rating: rating,
        comment: comment || null,
    };

    try {
        const r = await fetch(`${API_URL}/api/store/reviews/${encodeURIComponent(slug)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });

        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);

        showToast(`✅ ${data.message}`, 'success');
        setTimeout(() => loadPluginDetail(), 800);
    } catch (e) {
        showToast(`❌ ${e.message}`, 'error');
    }
}

// ============================================================
// MARK HELPFUL
// ============================================================
async function markHelpful(reviewId, btn) {
    try {
        const r = await fetch(`${API_URL}/api/store/reviews/${reviewId}/helpful`, { method: 'POST' });
        const data = await r.json();
        if (data.success) {
            btn.textContent = `👍 Hữu ích (${data.helpful_count})`;
            btn.style.color = 'var(--cyan)';
            btn.style.borderColor = 'var(--cyan)';
            btn.disabled = true;
        }
    } catch (e) { console.error(e); }
}

// ============================================================
// INSTALL PLUGIN
// ============================================================
async function installPlugin(slug) {
    try {
        const r = await fetch(`${API_URL}/api/store/install/${encodeURIComponent(slug)}`, { method: "POST" });
        const data = await r.json();
        if (data.success) {
            showToast(`✅ Đã install ${data.name} v${data.version}!`, "success");
        } else {
            showToast("❌ Install failed", "error");
        }
    } catch (e) {
        showToast(`❌ ${e.message}`, "error");
    }
}

// ============================================================
// SYNC TO GITHUB (Phase B)
// ============================================================
async function syncToGitHub(slug, pluginName) {
    const token = window.CogniAuth && window.CogniAuth.getToken();
    const user = window.CogniAuth && window.CogniAuth.getUser();

    if (!token || !user) {
        showToast('❌ Bạn cần đăng nhập để sync', 'error');
        return;
    }

    const repoName = prompt(
        `Tên repo GitHub cho "${pluginName}":`,
        slug.replace(/_/g, '-')
    );
    if (!repoName) return;

    if (!confirm(`Sync "${pluginName}" lên github.com/${repoName}?\n\nRepo sẽ được tạo (public) và push file .cogni.`)) {
        return;
    }

    showToast('⏳ Đang sync lên GitHub...', 'info');

    try {
        const r = await fetch(`${API_URL}/api/github/sync/${encodeURIComponent(slug)}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify({
                repo_name: repoName,
                private: false,
            }),
        });

        const data = await r.json();

        if (!r.ok) {
            throw new Error(data.detail || `HTTP ${r.status}`);
        }

        showToast(`✅ Đã sync lên GitHub!`, 'success');

        setTimeout(() => {
            if (confirm(`✅ Thành công!\n\nRepo: ${data.repo_url}\n\nMở repo?`)) {
                window.open(data.repo_url, '_blank');
            }
        }, 500);

    } catch (e) {
        showToast(`❌ ${e.message}`, 'error');
    }
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type = "info") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = `toast show ${type}`;
    setTimeout(() => toast.classList.remove("show"), 3000);
}

// INIT
loadPluginDetail();
</script>
</body>
</html>
