<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderation — CogniCraft Admin</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<style>
body {
  background: linear-gradient(135deg, #0a0a1e 0%, #1a0a2e 100%);
  color: #fff;
  font-family: 'Courier New', monospace;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}
.mod-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}
.mod-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid rgba(0, 255, 255, 0.2);
}
.mod-header h1 {
  color: #0ff;
  font-size: 1.8rem;
  margin: 0;
  text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}
.mod-header a {
  color: #0ff;
  text-decoration: none;
  padding: 0.5rem 1rem;
  border: 1px solid #0ff;
  border-radius: 6px;
  font-size: 0.9rem;
}
.mod-header a:hover { background: rgba(0, 255, 255, 0.1); }
.mod-section-title {
  color: #0ff;
  font-size: 1.2rem;
  margin: 2rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.mod-badge {
  background: #dc2626;
  color: #fff;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
}
.mod-card {
  background: rgba(20, 20, 40, 0.6);
  border: 1px solid #333;
  border-radius: 10px;
  padding: 1.2rem;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}
.mod-card:hover { border-color: #0ff; }
.mod-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.8rem;
}
.mod-card-title {
  color: #0ff;
  font-weight: bold;
  font-size: 1.1rem;
}
.mod-card-type {
  color: #fbbf24;
  font-size: 0.75rem;
  text-transform: uppercase;
  padding: 2px 8px;
  border: 1px solid #fbbf24;
  border-radius: 4px;
}
.mod-card-meta {
  display: flex;
  gap: 1rem;
  font-size: 0.8rem;
  color: #a0a0c0;
  margin-bottom: 0.8rem;
  flex-wrap: wrap;
}
.mod-card-desc {
  color: #c0c0d0;
  font-size: 0.9rem;
  margin-bottom: 1rem;
  line-height: 1.5;
}
.mod-card-actions {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.mod-btn {
  padding: 0.5rem 1rem;
  border-radius: 6px;
  border: 1px solid;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: bold;
  font-family: inherit;
  transition: all 0.2s;
}
.mod-btn-approve {
  background: rgba(22, 163, 74, 0.15);
  border-color: #16a34a;
  color: #16a34a;
}
.mod-btn-approve:hover { background: rgba(22, 163, 74, 0.3); }
.mod-btn-reject {
  background: rgba(220, 38, 38, 0.15);
  border-color: #dc2626;
  color: #dc2626;
}
.mod-btn-reject:hover { background: rgba(220, 38, 38, 0.3); }
.mod-btn-changes {
  background: rgba(251, 191, 36, 0.15);
  border-color: #fbbf24;
  color: #fbbf24;
}
.mod-btn-changes:hover { background: rgba(251, 191, 36, 0.3); }
.mod-empty {
  text-align: center;
  padding: 3rem 1rem;
  color: #888;
  font-size: 1rem;
}
.mod-loading {
  text-align: center;
  padding: 2rem;
  color: #0ff;
}
.mod-history-row {
  padding: 0.7rem;
  border-bottom: 1px solid #222;
  font-size: 0.85rem;
}
.mod-toast {
  position: fixed;
  top: 2rem;
  right: 2rem;
  padding: 1rem 1.5rem;
  border-radius: 10px;
  font-weight: bold;
  z-index: 999999;
  opacity: 0;
  transform: translateX(400px);
  transition: all 0.3s;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.mod-toast.show { opacity: 1; transform: translateX(0); }
.mod-toast-success { background: linear-gradient(135deg, #22c55e, #16a34a); }
.mod-toast-error   { background: linear-gradient(135deg, #ef4444, #dc2626); }
.mod-toast-info    { background: linear-gradient(135deg, #a855f7, #ec4899); }
</style>
</head>
<body>
  <div class="mod-container">
    <div class="mod-header">
      <h1>⏳ Moderation Panel</h1>
      <a href="admin.html">← Về Admin</a>
    </div>

    <div class="mod-section-title">
      📥 Hàng chờ duyệt
      <span class="mod-badge" id="queue-count">0</span>
    </div>
    <div id="queue-list">
      <div class="mod-loading">Đang tải...</div>
    </div>

    <div class="mod-section-title">📜 Lịch sử gần đây</div>
    <div id="history-list">
      <div class="mod-loading">Đang tải...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="moderation.js"></script>
</body>
</html>
